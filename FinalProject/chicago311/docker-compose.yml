x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: chicago311-airflow:2.11.2
  user: "${AIRFLOW_UID:-50000}:0"

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: chicago311-secret-key

    CHICAGO_311_DUCKDB_PATH: /opt/airflow/warehouse.duckdb

  volumes:
    - ./dags:/opt/airflow/dags
    - ./raw:/opt/airflow/raw
    - ./dbt_project:/opt/airflow/dbt_project
    - ./warehouse.duckdb:/opt/airflow/warehouse.duckdb
    - ./logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/raw
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/raw /opt/airflow/dbt_project /opt/airflow/warehouse.duckdb || true
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    environment:
      <<: *airflow-common-env

    user: "0:0"


  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8085:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    restart: always

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres-db-volume: